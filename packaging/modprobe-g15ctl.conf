# g15ctl: enable the in-tree AWCC driver on Dell G-series laptops.
#
# NOTE: install.sh rewrites the `options` line below to match the running
# kernel. Do not add parameters by hand -- modprobe REFUSES to load a module
# when given a parameter it does not recognise, so listing force_hwmon on a
# kernel older than 6.15 would stop alienware_wmi loading at all.
#
# The alienware-wmi driver only binds its thermal features to models listed in
# the kernel's awcc_dmi_table. The Dell G15 5530 is not in that table, but its
# firmware implements the interface correctly, so we opt in explicitly.
#
#   force_platform_profile=1  expose the AWCC thermal profiles through
#                             /sys/class/platform-profile (low-power, quiet,
#                             balanced, balanced-performance)
#   force_gmode=1             expose G-Mode as the `performance` profile
#   force_hwmon=1             expose fanN_boost for manual fan control.
#                             Kernel 6.15+ only. Where it is absent, g15ctl
#                             uses acpi_call for fan speed instead.
#
# These are "unsafe" module parameters, so loading them sets the kernel taint
# flag. That is expected and has no functional consequence; it only records
# that a driver was forced onto hardware its DMI table does not list.
options alienware_wmi force_platform_profile=1 force_gmode=1
