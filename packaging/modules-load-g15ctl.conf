# g15ctl needs these modules present at boot.
#
# acpi_call     provides /proc/acpi/call, which g15ctl uses to reach the
#               firmware's WMAX method. This is the only backend that can set a
#               per-fan boost on kernels before 6.15.
# dell_wmi_ddv  provides fan RPM and labelled temperatures via hwmon, readable
#               without root so the dashboard works as a normal user.
acpi_call
dell_wmi_ddv
